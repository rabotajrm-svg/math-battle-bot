<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Battle</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #439A86;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .score-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .score-value {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .leaderboard-item {
            width: 80%;
            max-width: 320px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .restart-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background-color: #317B6C;
            color: white;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .restart-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="score-title">YOUR SCORE</div>
    <div class="score-value" id="currentScore">0</div>

    <div class="leaderboard-item">
        <span id="playerName">1. Player</span>
        <span id="playerScore">0</span>
    </div>

    <button class="restart-btn" onclick="restartGame()">↻</button>

    <script>
        const tg = window.Telegram?.WebApp;

        function initGame() {
            if (tg) {
                tg.ready();
                tg.expand();
            }

            // Telegram orqali user ma'lumotlarini olish
            let userName = "Player";
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const u = tg.initDataUnsafe.user;
                userName = u.username ? `@${u.username}` : (u.first_name || "Player");
            } else {
                // Agar WebApp parametridan user_id/name o'qish kelsa:
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('name')) {
                    userName = urlParams.get('name');
                }
            }

            // O'yindagi ball (Bu yerga o'yiningizdagi haqiqiy score mantiqini qo'ying)
            let score = Math.floor(Math.random() * 40) + 10; 

            // Ekranda ko'rsatish
            document.getElementById("currentScore").innerText = score;
            document.getElementById("playerName").innerText = `1. ${userName}`;
            document.getElementById("playerScore").innerText = score;

            // Telegram Botga natijani yuborish
            if (tg) {
                tg.sendData(JSON.stringify({
                    score: score,
                    username: userName
                }));
            }
        }

        function restartGame() {
            location.reload();
        }

        // Sahifa yuklanishi bilan ishga tushirish
        window.onload = initGame;
    </script>
</body>
</html>
